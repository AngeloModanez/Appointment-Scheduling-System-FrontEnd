<div class="mb-4">
  <label [for]="id()" class="form-label fw-semibold text-dark mb-1">
    {{ title() }}
  </label>
  <select [id]="id()" [formControl]="control()" (change)="change()" class="form-select rounded-3 px-3"
    [class.is-invalid]="control().invalid && control().touched">
    <option [value]="null" disabled selected>Select {{ title() }}</option>
    <ng-content />
  </select>
  @if (control().invalid && control().touched) {
  <div class="text-danger mt-1">
    <small><sup>*</sup> {{ title() }} is required</small>
  </div>
  }
</div>
