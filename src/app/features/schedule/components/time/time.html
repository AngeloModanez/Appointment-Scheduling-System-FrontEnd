<div class="text-center mt-3">
  <p class="mb-2">Available Time Slots</p>
  @for (row of [0,1]; track $index) {
  <div class="row">
    @for (time of times().slice(row*8, (row+1)*8); track $index) {
    <app-time-slot [slot]="time" [selectedSlot]="selectedTime()" (slotClicked)="onSelectedTime($event)" />
    }
  </div>
  }
</div>
