<app-page-layout title="Professional Registration">
  <form>

    <div class="row">
      <div class="col-6">
        <app-form-input type="text" title="Full Name" id="professionalName" placeholder="Dr. Andrew"
          errorMessage="Name must be at least 3 characters" />
      </div>
      <div class="col-6">
        <app-form-input type="tel" title="Phone Number" id="phoneNumber" placeholder="+1 202 555 0143"
          errorMessage="Please enter a valid phone number" />
      </div>
    </div>

    <div class="col-5 d-flex align-items-center gap-3 mt-4">
      <label for="activeStatus" class="form-label fw-semibold text-dark mb-0 user-select-none" style="cursor: pointer;">
        Active Status
      </label>
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" role="switch" id="activeStatus"
          style="width: 3rem; height: 1.5rem; cursor: pointer;" />
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-2">
      <app-button btnClass="btn btn-outline-secondary" buttonName="Cancel" />
      <app-button buttonName="Save Professional" />
    </div>

  </form>
</app-page-layout>
