<app-page-layout title="Clients Registration" buttonName="New Client" (goTo)="goToNewClient()">
  <app-search-input placeholder="Search clients name" (search)="filter.set($event)">
  </app-search-input>

  <app-table>
    <tr table-head>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Phone Number</th>
      <th scope="col">Date of Birth</th>
      <th scope="col">Delete</th>
    </tr>

    <ng-container table-body>
      @for (client of filteredClients(); track client.id) {
      <tr>
        <th scope="row" class="text-muted">{{client.id}}</th>
        <td class="fw-semibold">{{client.name}}</td>
        <td>{{client.phone}}</td>
        <td>{{client.dateOfBirth}}</td>
        <td>
          <button class="btn btn-sm" (click)="delete(client)">
            <img src="/icons/trash-fill.svg" width="16" height="16" alt="Delete">
          </button>
        </td>
      </tr>
      }
    </ng-container>
  </app-table>
</app-page-layout>
