<app-page-layout title="Clients Registration" buttonName="New Client" (goTo)="goToNewClient()">
  <app-search-input placeholder="Search clients" (search)="filter.set($event)">
  </app-search-input>

  <app-table>
    <tr table-head>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Phone Number</th>
      <th scope="col">Date of Birth</th>
      <th scope="col">Delete</th>
    </tr>

    <ng-container table-body>
      @for (client of filteredClients(); track client.id) {
      <tr>
        <th scope="row">{{client.id}}</th>
        <td>
          <a>{{client.name}}</a>
        </td>
        <td>{{client.phone}}</td>
        <td>{{client.dateOfBirth}}</td>
        <td>
          <img src="/icons/trash-fill.svg" width="20" height="20" alt="Delete client">
        </td>
      </tr>
      }
    </ng-container>
  </app-table>
</app-page-layout>
