<app-page-layout title="Clients Registration" btn="New Client" (goTo)="goToNewClient()">
  <app-table-search-input placeholder="Search clients" (search)="filterClients($event)">
  </app-table-search-input>

  <app-table>
    <tr table-head>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Phone Number</th>
      <th scope="col">Date of Birth</th>
      <th scope="col">Delete</th>
    </tr>

    <ng-container table-body>
      <tr>
        <th scope="row">1</th>
        <td>
          <a href="/prototype/pages/client.html">Maria Lucia</a>
        </td>
        <td>+55 (11) 9975-1539</td>
        <td>11/22/2026</td>
        <td>
          <img src="/icons/trash-fill.svg" width="20" height="20" alt="Delete client">
        </td>
      </tr>
    </ng-container>
  </app-table>
</app-page-layout>
